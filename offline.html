<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión - GTC Pro</title>
    <style>
        body { 
            font-family: 'Inter', Arial, sans-serif; 
            background: #0b0f1a; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .offline-card { 
            background: #1a1f2f; 
            padding: 40px; 
            border-radius: 20px; 
            text-align: center; 
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { 
            color: #00c2ff; 
            margin-bottom: 20px;
        }
        p { 
            color: #94a3b8; 
            margin: 15px 0;
            line-height: 1.6;
        }
        button { 
            background: #00c2ff; 
            color: white; 
            border: none; 
            padding: 12px 30px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600;
            margin-top: 20px;
            transition: background 0.3s;
        }
        button:hover {
            background: #0099cc;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <h1>📡 Sin conexión</h1>
        <p>No tenés internet en este momento.</p>
        <p>Algunas funciones pueden no estar disponibles hasta que se restablezca la conexión.</p>
        <button onclick="window.location.reload()">Reintentar</button>
    </div>
</body>
</html>
